<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заказ — Кофейня «Зерно»</title><link rel="stylesheet" href="style.css"></head>
<body><header><a id="logo" href="index.html">Зерно</a>
<button id="menu-toggle" aria-label="Меню">☰</button><nav id="nav"><a id="nav-home" href="index.html">Главная</a><a id="nav-menu" href="menu.html">Меню</a><a id="nav-about" href="about.html">О нас</a><a id="nav-contacts" href="contacts.html">Контакты</a><a id="nav-order" href="order.html" class="active">Заказ</a></nav></header>
<main><h1>Заказ</h1><div id="order"><div class="row" data-id="espresso" data-price="150"><span class="name">Эспрессо — 150 ₽</span><button id="minus-espresso" class="minus">−</button><span id="qty-espresso" class="qty">0</span><button id="plus-espresso" class="plus">+</button></div><div class="row" data-id="cappuccino" data-price="200"><span class="name">Капучино — 200 ₽</span><button id="minus-cappuccino" class="minus">−</button><span id="qty-cappuccino" class="qty">0</span><button id="plus-cappuccino" class="plus">+</button></div><div class="row" data-id="cheesecake" data-price="250"><span class="name">Чизкейк — 250 ₽</span><button id="minus-cheesecake" class="minus">−</button><span id="qty-cheesecake" class="qty">0</span><button id="plus-cheesecake" class="plus">+</button></div><div class="row" data-id="croissant" data-price="120"><span class="name">Круассан — 120 ₽</span><button id="minus-croissant" class="minus">−</button><span id="qty-croissant" class="qty">0</span><button id="plus-croissant" class="plus">+</button></div></div><div class="promo"><input id="promo" type="text" placeholder="Промокод"><button id="apply-promo">Применить</button></div><p class="total">Итого: <span id="total">0</span> ₽</p><button id="checkout">Оформить заказ</button> <button id="clear">Очистить</button><p id="order-status"></p></main>
